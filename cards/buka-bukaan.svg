<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Consolas, Menlo, 'Courier New', monospace">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3D66"/><stop offset="1" stop-color="#2B2B45"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20203C"/><stop offset="1" stop-color="#12122A"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2A2A4A"/><stop offset="1" stop-color="#1C1C36"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C4E"/><stop offset="1" stop-color="#1D1D38"/>
    </linearGradient>
    <radialGradient id="glowYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD23F" stop-opacity="0.14"/><stop offset="1" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#1A1A2E"/>
  <circle cx="640" cy="165" r="160" fill="url(#glowYellow)"/>

  <g filter="url(#soft)">
    <ellipse cx="380" cy="302" rx="330" ry="16" fill="#000000" opacity="0.4"/>
  </g>

  <g>
    <polygon points="24,46 736,46 760,30 48,30" fill="url(#faceTop)"/>
    <polygon points="736,46 760,30 760,286 736,286" fill="url(#faceRight)"/>
    <polygon points="24,46 48,30 48,286 24,286" fill="url(#faceLeft)"/>
    <rect x="24" y="46" width="712" height="240" rx="14" fill="url(#bezel)"/>
    <line x1="32" y1="52" x2="728" y2="52" stroke="#4A4A78" stroke-width="1.5" opacity="0.8"/>

    <text x="44" y="80" font-size="13" fill="#FFD23F">Mengapa profil ini berbahasa Indonesia?</text>
    <text x="44" y="98" font-size="13" fill="#E8E8E8">Karena pembacanya juga orang Indonesia.</text>

    <text x="44" y="126" font-size="13" fill="#FFD23F">Error favorit?</text>
    <text x="44" y="144" font-size="13" fill="#E8E8E8">Semua error merah yang pesannya jelas. Yang merepotkan</text>
    <text x="44" y="160" font-size="13" fill="#E8E8E8">justru error diam-diam tanpa penjelasan.</text>

    <text x="44" y="188" font-size="13" fill="#FFD23F">Tips untuk pemula?</text>
    <text x="44" y="206" font-size="13" fill="#E8E8E8">Baca pesan errornya terlebih dahulu. Sebagian besar</text>
    <text x="44" y="222" font-size="13" fill="#E8E8E8">sudah menjelaskan masalahnya.</text>

    <text x="44" y="250" font-size="13" fill="#FFD23F">Kapan paling produktif?</text>
    <text x="44" y="268" font-size="13" fill="#E8E8E8">Saat kode berjalan benar pada percobaan pertama.</text>
    <text x="44" y="284" font-size="13" fill="#E8E8E8">Momen langka yang selalu diburu.</text>
  </g>
</svg>