<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Consolas, Menlo, 'Courier New', monospace">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3D66"/><stop offset="1" stop-color="#2B2B45"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20203C"/><stop offset="1" stop-color="#12122A"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2A2A4A"/><stop offset="1" stop-color="#1C1C36"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C4E"/><stop offset="1" stop-color="#1D1D38"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.18"/><stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="760" height="300" fill="#1A1A2E"/>
  <circle cx="640" cy="150" r="160" fill="url(#glowTeal)"/>

  <g filter="url(#soft)">
    <ellipse cx="380" cy="272" rx="330" ry="16" fill="#000000" opacity="0.4"/>
  </g>

  <g>
    <polygon points="24,46 736,46 760,30 48,30" fill="url(#faceTop)"/>
    <polygon points="736,46 760,30 760,226 736,226" fill="url(#faceRight)"/>
    <polygon points="24,46 48,30 48,226 24,226" fill="url(#faceLeft)"/>
    <rect x="24" y="46" width="712" height="180" rx="14" fill="url(#bezel)"/>
    <line x1="32" y1="52" x2="728" y2="52" stroke="#4A4A78" stroke-width="1.5" opacity="0.8"/>

    <text x="44" y="80" font-size="13" fill="#FFD23F">8cf9d0d</text>
    <text x="140" y="80" font-size="13" fill="#E8E8E8">convert text sections to 3D depth cards</text>
    <text x="44" y="108" font-size="13" fill="#FFD23F">4ed27eb</text>
    <text x="140" y="108" font-size="13" fill="#E8E8E8">fix role to frontend engineer, upgrade header</text>
    <text x="44" y="136" font-size="13" fill="#FFD23F">01dd1d1</text>
    <text x="140" y="136" font-size="13" fill="#E8E8E8">header: proper 3D perspective terminal</text>
    <text x="44" y="164" font-size="13" fill="#FFD23F">9cbb170</text>
    <text x="140" y="164" font-size="13" fill="#E8E8E8">use GITHUB_TOKEN for metrics workflow</text>
    <text x="44" y="192" font-size="13" fill="#FFD23F">ec333a1</text>
    <text x="140" y="192" font-size="13" fill="#E8E8E8">restore proper terminal theme with streak</text>
  </g>
