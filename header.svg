<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Consolas, Menlo, 'Courier New', monospace">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3D66"/>
      <stop offset="1" stop-color="#2B2B45"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20203C"/>
      <stop offset="1" stop-color="#12122A"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2A2A4A"/>
      <stop offset="1" stop-color="#1C1C36"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C4E"/>
      <stop offset="1" stop-color="#1D1D38"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17323C"/>
      <stop offset="0.5" stop-color="#101C28"/>
      <stop offset="1" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6A4C93" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6A4C93" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="320" fill="#1A1A2E"/>

  <circle cx="130" cy="170" r="150" fill="url(#glowTeal)"/>
  <circle cx="680" cy="130" r="170" fill="url(#glowPurple)"/>

  <g opacity="0.5">
    <circle cx="110" cy="90" r="1.8" fill="#2EC4B6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="200" r="1.6" fill="#6A4C93">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="80" r="1.4" fill="#FFD23F">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="230" r="1.5" fill="#2EC4B6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="60" r="1.3" fill="#FFD23F">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.9s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="250" r="1.7" fill="#2EC4B6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#2B2B45" stroke-width="1.5" opacity="0.3">
    <line x1="400" y1="252" x2="150" y2="340"/>
    <line x1="400" y1="252" x2="233" y2="340"/>
    <line x1="400" y1="252" x2="316" y2="340"/>
    <line x1="400" y1="252" x2="400" y2="340"/>
    <line x1="400" y1="252" x2="484" y2="340"/>
    <line x1="400" y1="252" x2="567" y2="340"/>
    <line x1="400" y1="252" x2="650" y2="340"/>
    <line x1="120" y1="266" x2="680" y2="266"/>
    <line x1="170" y1="282" x2="630" y2="282"/>
    <line x1="220" y1="302" x2="580" y2="302"/>
    <line x1="270" y1="328" x2="530" y2="328"/>
  </g>

  <polygon points="204,246 596,246 640,340 160,340" fill="url(#spill)"/>

  <g filter="url(#soft)">
    <ellipse cx="400" cy="280" rx="200" ry="20" fill="#000000" opacity="0.45"/>
  </g>
  <g filter="url(#tight)">
    <ellipse cx="400" cy="278" rx="150" ry="12" fill="#000000" opacity="0.4"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="6s" repeatCount="indefinite"/>

    <polygon points="190,80 610,80 650,54 230,54" fill="url(#faceTop)"/>
    <polygon points="610,80 650,54 650,214 610,260" fill="url(#faceRight)"/>
    <polygon points="190,80 230,54 230,214 190,260" fill="url(#faceLeft)"/>
    <rect x="190" y="80" width="420" height="180" rx="16" fill="url(#bezel)"/>

    <line x1="196" y1="86" x2="604" y2="86" stroke="#4A4A78" stroke-width="1.5" opacity="0.8"/>
    <line x1="610" y1="80" x2="650" y2="54" stroke="#3A3A60" stroke-width="1.5" opacity="0.7"/>
    <line x1="190" y1="80" x2="230" y2="54" stroke="#4A4A78" stroke-width="1.5" opacity="0.7"/>

    <rect x="204" y="94" width="392" height="152" rx="10" fill="url(#screenGlass)"/>
    <rect x="204" y="94" width="392" height="152" rx="10" fill="url(#glassReflect)"/>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.35s" fill="freeze"/>
      <text x="222" y="128" font-size="14" fill="#2EC4B6">evan@github:~$</text>
      <text x="344" y="128" font-size="14" fill="#E8E8E8">whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.35s" fill="freeze"/>
      <text x="222" y="152" font-size="14" fill="#FFD23F">Evan Rasyid Ega Pratama</text>
      <text x="408" y="152" font-size="14" fill="#E8E8E8">— Frontend Engineer</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.35s" fill="freeze"/>
      <text x="222" y="176" font-size="14" fill="#2EC4B6">evan@github:~$</text>
      <text x="344" y="176" font-size="14" fill="#E8E8E8">./status</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.35s" fill="freeze"/>
      <text x="222" y="200" font-size="14" fill="#E8E8E8">3 tabs · coffee low · error merah = seru</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.35s" fill="freeze"/>
      <text x="222" y="224" font-size="14" fill="#2EC4B6">evan@github:~$</text>
      <rect x="344" y="212" width="7" height="12" fill="#2EC4B6">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.45;1" dur="1.1s" begin="3.7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <polygon points="330,260 470,260 448,278 352,278" fill="url(#faceRight)"/>
    <rect x="336" y="278" width="128" height="10" rx="5" fill="url(#bezel)"/>
  </g>

  <line x1="24" y1="14" x2="776" y2="14" stroke="#2B2B45" stroke-width="1"/>
  <circle cx="36" cy="302" r="3" fill="#2EC4B6"/>
  <text x="46" y="306" font-size="12" fill="#6A4C93">online — frontend, tiga dimensi, satu kopi</text>
  <text x="772" y="306" font-size="12" fill="#6A4C93" text-anchor="end">3 sesi · 1 error lucu</text>
</svg>