name: Terminal Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics-terminal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: terminal
          base: header, activity, repositories
          config_timezone: Asia/Jakarta
