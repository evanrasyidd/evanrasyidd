name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # jalan tiap hari jam 00:00 UTC
  workflow_dispatch: {} # bisa dipicu manual dari tab Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: evanrasyidd
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#6A4C93&color_dots=#E8E8E8,#D9C9F0,#2EC4B6,#FFD23F
            dist/snake-dark.svg?palette=github-dark&color_snake=#6A4C93&color_dots=#2B2B45,#6A4C93,#2EC4B6,#FFD23F
            dist/snake.gif?color_snake=#FFD23F&color_dots=#2B2B45,#6A4C93,#2EC4B6,#FFD23F,#FFD23F&color_background=#1A1A2E

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
